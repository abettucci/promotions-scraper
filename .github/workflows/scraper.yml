name: Run Promo Scraper

on:
  schedule:
    # Corre cada 6 horas (0:00, 6:00, 12:00, 18:00 UTC)
    # Ajustá según necesites: https://crontab.guru/
    - cron: '0 */6 * * *'
  
  # También permite ejecutar manualmente desde GitHub
  workflow_dispatch:

env:
  # Scrapling deshabilitado para Carrefour — genera demasiados duplicados por _NEXT_DATA_ JSON
  USE_SCRAPLING: 'false'
  SCRAPLING_ADAPTIVE: 'false'
  HEADLESS: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Scrapling browsers
        run: |
          scrapling install

      - name: Run scraper
        env:
          USE_SCRAPLING: ${{ env.USE_SCRAPLING }}
          SCRAPLING_ADAPTIVE: ${{ env.SCRAPLING_ADAPTIVE }}
          HEADLESS: ${{ env.HEADLESS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scraper.py

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotions-db-${{ github.run_number }}
          path: data/promotions.db
          retention-days: 7

      - name: Commit and push database (optional)
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/promotions.db || true
          git diff --staged --quiet || git commit -m "chore: update promotions database [skip ci]"
          git push || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}