name: Run Promo Scraper

on:
  schedule:
    # 9:00 y 21:00 ART (12:00 y 00:00 UTC)
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'

  # Ejecución manual desde la UI de GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Necesario para que el push posterior funcione con el token por defecto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Evita descargar Chromium en cada runner efímero. La key incluye la
      # versión de Playwright declarada en requirements.txt.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Guarda únicamente huellas SHA-256 de resultados normalizados. El job
      # sigue consultando cada fuente para no servir promociones vencidas.
      - name: Restore scraper result cache
        uses: actions/cache/restore@v4
        with:
          path: .scraper-cache
          key: scraper-results-restore-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scraper-results-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          HEADLESS: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEBUG_SCRAPER: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py --notify

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-${{ github.run_id }}
          path: |
            debug_*.html
            debug_*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit and push updated database
        if: success()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/promotions.db
          git diff --staged --quiet && echo "DB sin cambios, nada que pushear." && exit 0
          git commit -m "chore: update promotions database [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Se guarda sólo después de que la DB quedó publicada. De esta forma una
      # huella nunca puede hacer que se saltee una actualización que no llegó
      # al repositorio por un fallo de push.
      - name: Build scraper cache key
        id: scraper-cache-key
        if: success()
        run: |
          if [ -f .scraper-cache/results-v1.json ]; then
            echo "key=scraper-results-${RUNNER_OS}-$(sha256sum .scraper-cache/results-v1.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save scraper result cache
        if: success() && steps.scraper-cache-key.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .scraper-cache
          key: ${{ steps.scraper-cache-key.outputs.key }}

      - name: Trigger Railway redeploy
        if: success()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}" \
          | grep -qE '^2' && echo "Railway redeploy triggered." || echo "Webhook falló o no configurado."
